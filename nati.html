<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Natasha 💜</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0a0015;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
    }

    /* ===== VÍDEO DE FUNDO (COM ÁUDIO E ÁREA CLARIFICADA) ===== */
    .video-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
    }
    .video-bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.5) saturate(0.7) contrast(1.2);
    }
    .video-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 70% 50%,
                  rgba(80,0,120,0) 0%,
                  rgba(80,0,120,0.05) 20%,
                  rgba(40,0,80,0.2) 40%,
                  rgba(40,0,80,0.5) 65%,
                  rgba(20,0,40,0.85) 100%);
    }

    /* ===== ELOGIOS E APELIDOS CAINDO ===== */
    .phrases-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9997;
      overflow: hidden;
    }
    .falling-phrase {
      position: absolute;
      top: -60px;
      font-family: 'Arial Black', 'Impact', sans-serif;
      font-weight: 900;
      font-size: 22px;
      color: rgba(200, 150, 255, 0.85);
      text-shadow: 0 0 20px rgba(150, 50, 255, 0.4), 0 0 40px rgba(150, 50, 255, 0.15);
      white-space: nowrap;
      pointer-events: none;
      animation: fallPhrase linear forwards;
      opacity: 0;
      transform: rotate(-5deg);
      letter-spacing: 1px;
    }
    .falling-phrase:nth-child(odd) {
      color: rgba(255, 200, 255, 0.8);
      text-shadow: 0 0 20px rgba(200, 100, 255, 0.4);
      transform: rotate(3deg);
      font-size: 20px;
    }
    .falling-phrase:nth-child(3n) {
      color: rgba(200, 100, 255, 0.8);
      text-shadow: 0 0 20px rgba(200, 100, 255, 0.4);
      transform: rotate(-8deg);
      font-size: 24px;
    }
    .falling-phrase:nth-child(5n) {
      color: rgba(255, 150, 255, 0.7);
      text-shadow: 0 0 20px rgba(255, 150, 255, 0.3);
      transform: rotate(5deg);
      font-size: 18px;
    }
    @keyframes fallPhrase {
      0% {
        transform: translateY(-60px) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      10% {
        opacity: 0.95;
        transform: translateY(10px) rotate(2deg) scale(1);
      }
      90% {
        opacity: 0.95;
      }
      100% {
        transform: translateY(110vh) rotate(-5deg) scale(0.9);
        opacity: 0;
      }
    }

    /* ===== CORAÇÃO ROXO CAINDO NO GATE ===== */
    .gate-fire {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9998;
      overflow: hidden;
    }
    .gate-fire-particle {
      position: absolute;
      top: -30px;
      font-size: 35px;
      animation: fallGateFire linear infinite;
      opacity: 0.9;
    }
    @keyframes fallGateFire {
      0% { transform: translateY(-30px) rotate(0deg); opacity: 0.9; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* ===== FOTOS FLUTUANDO ===== */
    .floating-photos {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 40px;
      padding: 20px;
    }

    .photo-item {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 4px solid #a855f7;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.3), 0 0 60px rgba(168, 85, 247, 0.1);
      overflow: hidden;
      animation: floatPhoto 6s ease-in-out infinite;
      pointer-events: auto;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .photo-item:hover {
      transform: scale(1.08) !important;
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.5), 0 0 100px rgba(168, 85, 247, 0.2);
      border-color: #c084fc;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Animações individuais para cada foto */
    .photo-item:nth-child(1) {
      animation-delay: 0s;
      animation-duration: 7s;
    }
    .photo-item:nth-child(2) {
      animation-delay: -1.5s;
      animation-duration: 6.5s;
    }
    .photo-item:nth-child(3) {
      animation-delay: -3s;
      animation-duration: 8s;
    }
    .photo-item:nth-child(4) {
      animation-delay: -4.5s;
      animation-duration: 5.5s;
    }
    .photo-item:nth-child(5) {
      animation-delay: -2s;
      animation-duration: 7.5s;
    }
    .photo-item:nth-child(6) {
      animation-delay: -5s;
      animation-duration: 6s;
    }

    @keyframes floatPhoto {
      0%, 100% {
        transform: translateY(0px) rotate(0deg) scale(1);
      }
      25% {
        transform: translateY(-30px) rotate(3deg) scale(1.02);
      }
      50% {
        transform: translateY(15px) rotate(-2deg) scale(0.98);
      }
      75% {
        transform: translateY(-20px) rotate(4deg) scale(1.01);
      }
    }

    /* ===== GATE DE ENTRADA ===== */
    .gate {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0a0015;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 25px;
      cursor: pointer;
      pointer-events: auto;
      user-select: none;
      transition: opacity 0.8s ease, transform 0.8s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .gate.hidden {
      opacity: 0;
      transform: scale(1.1);
      pointer-events: none;
    }
    .gate-symbol {
      font-size: 80px;
      animation: pulseGate 2.5s ease-in-out infinite;
    }
    .gate-hint {
      font-family: 'Arial', sans-serif;
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(168, 85, 247, 0.5);
      animation: breatheGate 3s ease-in-out infinite;
    }
    .gate-name {
      font-family: 'Georgia', serif;
      font-size: 32px;
      font-style: italic;
      color: rgba(200, 150, 255, 0.8);
      letter-spacing: 3px;
      text-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
    }
    @keyframes pulseGate {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    @keyframes breatheGate {
      0%, 100% { opacity: 0.3; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    /* ===== CARREGAMENTO ===== */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: #0a0015;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
      opacity: 0;
      visibility: hidden;
    }
    .loading-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(168, 85, 247, 0.2);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsivo */
    @media (max-width: 768px) {
      .photo-item { width: 120px; height: 120px; }
      .floating-photos { gap: 25px; padding: 15px; }
      .gate-name { font-size: 24px; }
      .gate-symbol { font-size: 60px; }
      .gate-fire-particle { font-size: 25px; }
      .falling-phrase { font-size: 16px !important; }
    }
    @media (max-width: 480px) {
      .photo-item { width: 90px; height: 90px; }
      .floating-photos { gap: 15px; padding: 10px; }
      .gate-symbol { font-size: 50px; }
      .gate-fire-particle { font-size: 20px; }
      .falling-phrase { font-size: 14px !important; }
    }
  </style>
</head>
<body>

<!-- ===== VÍDEO DE FUNDO (COM ÁUDIO) ===== -->
<div class="video-bg">
  <video id="bg-video" autoplay loop muted playsinline preload="auto" volume="0.2">
    <source src="https://www.image2url.com/r2/default/videos/1784959627710-50594137-b18b-46a7-a7b0-4aa8a0af8c31.mp4" type="video/mp4">
  </video>
</div>

<!-- ===== ELOGIOS E APELIDOS CAINDO ===== -->
<div class="phrases-container" id="phrases-container"></div>

<!-- ===== CORAÇÕES ROXOS CAINDO NO GATE ===== -->
<div class="gate-fire" id="gate-fire"></div>

<!-- ===== FOTOS FLUTUANDO ===== -->
<div class="floating-photos" id="floating-photos"></div>

<!-- ===== GATE DE ENTRADA ===== -->
<div class="gate" id="gate">
  <div class="gate-symbol">💜</div>
  <div class="gate-name">Natasha 💜</div>
  <div class="gate-hint">✦ Clique para entrar ✦</div>
</div>

<!-- ===== LOADING ===== -->
<div class="loading-overlay" id="loading">
  <div class="loading-spinner"></div>
</div>

<script>
  (function() {
    const gate = document.getElementById('gate');
    const loading = document.getElementById('loading');
    const phrasesContainer = document.getElementById('phrases-container');
    const gateFire = document.getElementById('gate-fire');
    const floatingPhotos = document.getElementById('floating-photos');
    const bgVideo = document.getElementById('bg-video');

    // ===== LISTA DE FOTOS =====
    const photoUrls = [
      "https://www.image2url.com/r2/default/files/1784960559144-b0f6b066-573d-4ef4-a5cd-d94f4f04d60d.jpg",
      "https://i.ibb.co/ycfxF55P/IMG-20260725-024937.jpg",
      "https://i.ibb.co/nNPtzRVJ/IMG-20260725-025005.jpg"
    ];

    // ===== FUNÇÃO PARA EMBARALHAR ARRAY =====
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // ===== GERAR ORDEM DAS FOTOS =====
    function generatePhotoOrder() {
      const group1 = shuffleArray([...photoUrls]);
      const group2 = shuffleArray([...photoUrls]);
      return [...group1, ...group2];
    }

    // ===== RENDERIZAR FOTOS =====
    function renderPhotos() {
      const order = generatePhotoOrder();
      floatingPhotos.innerHTML = '';
      
      order.forEach((url, index) => {
        const div = document.createElement('div');
        div.className = 'photo-item';
        
        const img = document.createElement('img');
        img.src = url;
        img.alt = `Natasha ${index + 1}`;
        img.loading = 'lazy';
        
        div.appendChild(img);
        floatingPhotos.appendChild(div);
      });
    }

    renderPhotos();

    // ===== MUDAR URL =====
    const complimentsForURL = [
      "NATASHA", "NATI", "MINHA-FLOR", "MEU-AMOR", "PERFEITA", "DEUSA", "RAINHA",
      "LINDA", "MARAVILHOSA", "INCRIVEL", "ESPECIAL", "UNICA", "RADIANTE",
      "ENCANTADORA", "DESLUMBRANTE", "SENSUAL", "FOFURA", "GATA", "LINDONA"
    ];

    function changeURL() {
      const randomCompliment = complimentsForURL[Math.floor(Math.random() * complimentsForURL.length)];
      const newURL = window.location.origin + '/' + randomCompliment;
      window.history.pushState(null, '', newURL);
    }

    // ===== LISTA DE ELOGIOS =====
    const compliments = [
      "NATASHA 💜", "NATI 💜", "MINHA FLOR", "MINHA NATI", "MINHA NATASHA",
      "NATASHA LINDA", "NATI LINDA", "FLOR LINDA", "MEU AMOR NATASHA", "MEU AMOR NATI",
      "NATASHA PERFEITA", "NATI PERFEITA", "NATASHA MARAVILHOSA", "NATI MARAVILHOSA",
      "NATASHA INCRÍVEL", "NATI INCRÍVEL", "NATASHA ESPECIAL", "NATI ESPECIAL",
      "NATASHA ÚNICA", "NATI ÚNICA", "NATASHA RADIANTE", "NATI RADIANTE",
      "NATASHA ENCANTADORA", "NATI ENCANTADORA", "NATASHA DESLUMBRANTE", "NATI DESLUMBRANTE",
      "NATASHA SENSUAL", "NATI SENSUAL", "NATASHA FOFURA", "NATI FOFURA",
      "NATASHA GATA", "NATI GATA", "NATASHA LINDONA", "NATI LINDONA",
      "AMO VOCÊ NATASHA 💜", "AMO VOCÊ NATI 💜", "TE AMO NATASHA", "TE AMO NATI",
      "EU TE AMO NATASHA 💜", "EU TE AMO NATI 💜",
      "VOCÊ É TUDO PRA MIM NATASHA", "VOCÊ É TUDO PRA MIM NATI",
      "VOCÊ É PERFEITA NATASHA", "VOCÊ É PERFEITA NATI",
      "VOCÊ ME COMPLETA NATASHA", "VOCÊ ME COMPLETA NATI",
      "VOCÊ ME FAZ FELIZ NATASHA", "VOCÊ ME FAZ FELIZ NATI",
      "VOCÊ É MINHA VIDA NATASHA", "VOCÊ É MINHA VIDA NATI",
      "VOCÊ É MEU TUDO NATASHA", "VOCÊ É MEU TUDO NATI",
      "VOCÊ É MEU AMOR NATASHA", "VOCÊ É MEU AMOR NATI",
      "VOCÊ É MINHA PRINCESA NATASHA", "VOCÊ É MINHA PRINCESA NATI",
      "VOCÊ É MEU ANJO NATASHA", "VOCÊ É MEU ANJO NATI",
      "VOCÊ É MEU CORAÇÃO NATASHA", "VOCÊ É MEU CORAÇÃO NATI",
      "VOCÊ É MINHA RAINHA NATASHA 💜", "VOCÊ É MINHA RAINHA NATI 💜",
      "VOCÊ É MINHA DEUSA NATASHA 💜", "VOCÊ É MINHA DEUSA NATI 💜",
      "VOCÊ É MINHA FLOR NATASHA", "VOCÊ É MINHA FLOR NATI",
      "VOCÊ É MEU SOL NATASHA", "VOCÊ É MEU SOL NATI",
      "VOCÊ É MINHA LUZ NATASHA", "VOCÊ É MINHA LUZ NATI",
      "VOCÊ É MEU TESOURO NATASHA", "VOCÊ É MEU TESOURO NATI",
      "VOCÊ É MEU MUNDO NATASHA", "VOCÊ É MEU MUNDO NATI",
      "VOCÊ É MINHA PAIXÃO NATASHA", "VOCÊ É MINHA PAIXÃO NATI",
      "VOCÊ É MEU SONHO NATASHA", "VOCÊ É MEU SONHO NATI",
      "VOCÊ É MINHA FELICIDADE NATASHA", "VOCÊ É MINHA FELICIDADE NATI",
      "VOCÊ É MEU SORRISO NATASHA", "VOCÊ É MEU SORRISO NATI",
      "VOCÊ É MEU ABRAÇO NATASHA", "VOCÊ É MEU ABRAÇO NATI",
      "VOCÊ É MINHA CALMA NATASHA", "VOCÊ É MINHA CALMA NATI",
      "VOCÊ É MEU REFÚGIO NATASHA", "VOCÊ É MEU REFÚGIO NATI",
      "VOCÊ É MINHA MUSA NATASHA", "VOCÊ É MINHA MUSA NATI",
      "VOCÊ É MINHA INSPIRAÇÃO NATASHA", "VOCÊ É MINHA INSPIRAÇÃO NATI",
      "VOCÊ É MEU GRANDE AMOR NATASHA", "VOCÊ É MEU GRANDE AMOR NATI",
      "VOCÊ É MEU AMOR ETERNO NATASHA", "VOCÊ É MEU AMOR ETERNO NATI",
      "VOCÊ É MINHA ALMA GÊMEA NATASHA", "VOCÊ É MINHA ALMA GÊMEA NATI",
      "VOCÊ É MINHA METADE NATASHA", "VOCÊ É MINHA METADE NATI",
      "VOCÊ É MEU MOTIVO NATASHA", "VOCÊ É MEU MOTIVO NATI",
      "VOCÊ É MINHA RAZÃO NATASHA", "VOCÊ É MINHA RAZÃO NATI",
      "VOCÊ É MEU ARCO ÍRIS NATASHA", "VOCÊ É MEU ARCO ÍRIS NATI",
      "VOCÊ É MEU POR DO SOL NATASHA", "VOCÊ É MEU POR DO SOL NATI",
      "VOCÊ É MEU ORGULHO NATASHA", "VOCÊ É MEU ORGULHO NATI",
      "VOCÊ ME FAZ BEM NATASHA", "VOCÊ ME FAZ BEM NATI",
      "VOCÊ ME FAZ FELIZ DE VERDADE NATASHA", "VOCÊ ME FAZ FELIZ DE VERDADE NATI",
      "VOCÊ É LINDA DEMAIS NATASHA", "VOCÊ É LINDA DEMAIS NATI",
      "VOCÊ ME ENCANTA NATASHA", "VOCÊ ME ENCANTA NATI",
      "VOCÊ ME FAZ SORRIR NATASHA", "VOCÊ ME FAZ SORRIR NATI",
      "NATASHA EU TE AMO 💜", "NATI EU TE AMO 💜",
      "NATASHA 💜", "NATI 💜",
      "MINHA FLOR NATASHA", "MINHA FLOR NATI",
      "NATASHA MEU AMOR", "NATI MEU AMOR",
      "NATASHA MINHA VIDA", "NATI MINHA VIDA",
      "NATASHA MEU TUDO", "NATI MEU TUDO",
      "NATASHA MINHA PRINCESA", "NATI MINHA PRINCESA",
      "NATASHA MEU ANJO", "NATI MEU ANJO",
      "NATASHA MEU CORAÇÃO", "NATI MEU CORAÇÃO",
      "NATASHA MINHA RAINHA 💜", "NATI MINHA RAINHA 💜",
      "NATASHA MINHA DEUSA 💜", "NATI MINHA DEUSA 💜"
    ];

    // ===== ELOGIOS CAINDO =====
    const isMobile = window.innerWidth < 600;
    let phraseInterval = null;

    function createFallingPhrase() {
      if (!phrasesContainer) return;
      const phrase = document.createElement('div');
      phrase.classList.add('falling-phrase');
      
      const randomCompliment = compliments[Math.floor(Math.random() * compliments.length)];
      phrase.textContent = randomCompliment;
      
      phrase.style.left = Math.random() * 100 + '%';
      
      const sizeVariation = isMobile ? 14 : 22;
      const randomSize = Math.floor(Math.random() * 10) + sizeVariation;
      phrase.style.fontSize = randomSize + 'px';
      
      const duration = Math.random() * (isMobile ? 10 : 7) + (isMobile ? 6 : 4);
      phrase.style.animationDuration = duration + 's';
      
      phrase.style.animationDelay = Math.random() * 5 + 's';
      
      const rotation = (Math.random() - 0.5) * 15;
      phrase.style.transform = `rotate(${rotation}deg)`;
      
      phrasesContainer.appendChild(phrase);
      
      setTimeout(() => {
        if (phrase && phrase.remove) phrase.remove();
      }, (duration + 5) * 1000);
    }

    function startPhrases() {
      if (phraseInterval) clearInterval(phraseInterval);
      phraseInterval = setInterval(createFallingPhrase, isMobile ? 2500 : 1200);
      for (let i = 0; i < (isMobile ? 6 : 12); i++) {
        setTimeout(createFallingPhrase, i * (isMobile ? 400 : 200));
      }
    }

    // ===== CORAÇÕES ROXOS CAINDO NO GATE =====
    let gateFireInterval = null;

    function createGateFire() {
      if (!gateFire) return;
      const fire = document.createElement('div');
      fire.classList.add('gate-fire-particle');
      fire.textContent = '💜';
      fire.style.left = Math.random() * 100 + '%';
      
      const size = Math.floor(Math.random() * 20) + 25;
      fire.style.fontSize = size + 'px';
      
      const duration = Math.random() * 6 + 4;
      fire.style.animationDuration = duration + 's';
      
      fire.style.animationDelay = Math.random() * 8 + 's';
      
      gateFire.appendChild(fire);
      
      setTimeout(() => {
        if (fire && fire.remove) fire.remove();
      }, (duration + 5) * 1000);
    }

    function startGateFire() {
      if (gateFireInterval) clearInterval(gateFireInterval);
      gateFireInterval = setInterval(createGateFire, 3000);
      for (let i = 0; i < 5; i++) {
        setTimeout(createGateFire, i * 800);
      }
    }

    // ===== ABRIR SITE =====
    function openSite(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      if (!gate) return;
      if (gate.classList.contains('hidden')) return;
      
      if (loading) loading.classList.add('active');
      
      gate.classList.add('hidden');
      
      setTimeout(() => {
        if (loading) loading.classList.remove('active');
        startPhrases();
        if (gateFireInterval) clearInterval(gateFireInterval);
        if (gateFire) gateFire.innerHTML = '';
        
        changeURL();
        renderPhotos();
        
        // ATIVAR ÁUDIO DO VÍDEO (volume 20%)
        if (bgVideo) {
          bgVideo.volume = 0.2;
          bgVideo.muted = false;
          bgVideo.play().catch(() => {});
        }
      }, 1500);
    }

    // ===== EVENTOS =====
    if (gate) {
      gate.removeEventListener('touchstart', openSite);
      gate.removeEventListener('click', openSite);
      
      gate.addEventListener('touchstart', openSite, { passive: false });
      gate.addEventListener('click', openSite);
      
      gate.style.cursor = 'pointer';
    }

    startGateFire();

    // ===== INICIAR VÍDEO (MUDO INICIALMENTE) =====
    if (bgVideo) {
      bgVideo.volume = 0.2;
      bgVideo.muted = true; // Começa mudo por causa do autoplay
      bgVideo.play().then(() => {
        // Só ativa o áudio depois que o usuário interagir (no openSite)
      }).catch(() => {});
    }

  })();
</script>
</body>
</html>
