<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Natasha ✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #050304;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
    }

    /* ===== VÍDEO DE FUNDO ===== */
    .video-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
    }
    .video-bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.3) saturate(0.5) contrast(1.2);
    }
    .video-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 50% 50%, rgba(20,0,0,0) 0%, rgba(5,3,4,0.8) 100%);
    }

    /* ===== FRASES CAINDO (xingamentos) ===== */
    .phrases-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9997;
      overflow: hidden;
    }
    .falling-phrase {
      position: absolute;
      top: -60px;
      font-family: 'Arial Black', 'Impact', sans-serif;
      font-weight: 900;
      font-size: 22px;
      color: rgba(255, 50, 50, 0.7);
      text-shadow: 0 0 15px rgba(255, 0, 0, 0.3), 0 0 30px rgba(255, 0, 0, 0.1);
      white-space: nowrap;
      pointer-events: none;
      animation: fallPhrase linear forwards;
      opacity: 0;
      transform: rotate(-5deg);
      letter-spacing: 1px;
    }
    .falling-phrase:nth-child(odd) {
      color: rgba(255, 215, 0, 0.6);
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
      transform: rotate(3deg);
      font-size: 20px;
    }
    .falling-phrase:nth-child(3n) {
      color: rgba(255, 100, 200, 0.6);
      text-shadow: 0 0 15px rgba(255, 100, 200, 0.3);
      transform: rotate(-8deg);
      font-size: 24px;
    }
    .falling-phrase:nth-child(5n) {
      color: rgba(0, 200, 255, 0.5);
      text-shadow: 0 0 15px rgba(0, 200, 255, 0.2);
      transform: rotate(5deg);
      font-size: 18px;
    }
    @keyframes fallPhrase {
      0% {
        transform: translateY(-60px) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
        transform: translateY(10px) rotate(2deg) scale(1);
      }
      90% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(110vh) rotate(-5deg) scale(0.9);
        opacity: 0;
      }
    }

    /* ===== FOGUINHO CAINDO NO GATE ===== */
    .gate-fire {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9998;
      overflow: hidden;
    }
    .gate-fire-particle {
      position: absolute;
      top: -30px;
      font-size: 30px;
      animation: fallGateFire linear infinite;
      opacity: 0.8;
    }
    @keyframes fallGateFire {
      0% { transform: translateY(-30px) rotate(0deg); opacity: 0.9; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* ===== FOTOS FLUTUANDO ===== */
    .floating-photos {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 40px;
      padding: 20px;
    }

    .photo-item {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.15), 0 0 60px rgba(255, 255, 255, 0.05);
      overflow: hidden;
      animation: floatPhoto 6s ease-in-out infinite;
      pointer-events: auto;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .photo-item:hover {
      transform: scale(1.08) !important;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.3), 0 0 80px rgba(255, 255, 255, 0.1);
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Animações individuais para cada foto */
    .photo-item:nth-child(1) {
      animation-delay: 0s;
      animation-duration: 7s;
    }
    .photo-item:nth-child(2) {
      animation-delay: -1.5s;
      animation-duration: 6.5s;
    }
    .photo-item:nth-child(3) {
      animation-delay: -3s;
      animation-duration: 8s;
    }
    .photo-item:nth-child(4) {
      animation-delay: -4.5s;
      animation-duration: 5.5s;
    }
    .photo-item:nth-child(5) {
      animation-delay: -2s;
      animation-duration: 7.5s;
    }
    .photo-item:nth-child(6) {
      animation-delay: -5s;
      animation-duration: 6s;
    }

    @keyframes floatPhoto {
      0%, 100% {
        transform: translateY(0px) rotate(0deg) scale(1);
      }
      25% {
        transform: translateY(-30px) rotate(3deg) scale(1.02);
      }
      50% {
        transform: translateY(15px) rotate(-2deg) scale(0.98);
      }
      75% {
        transform: translateY(-20px) rotate(4deg) scale(1.01);
      }
    }

    /* ===== GATE DE ENTRADA ===== */
    .gate {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 25px;
      cursor: pointer;
      pointer-events: auto;
      user-select: none;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .gate.hidden {
      opacity: 0;
      transform: scale(1.1);
      pointer-events: none;
    }
    .gate-symbol {
      font-size: 80px;
      animation: pulseGate 2.5s ease-in-out infinite;
    }
    .gate-hint {
      font-family: 'Arial', sans-serif;
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      animation: breatheGate 3s ease-in-out infinite;
    }
    .gate-name {
      font-family: 'Georgia', serif;
      font-size: 32px;
      font-style: italic;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 3px;
    }
    @keyframes pulseGate {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    @keyframes breatheGate {
      0%, 100% { opacity: 0.3; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    /* ===== CARREGAMENTO ===== */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
      opacity: 0;
      visibility: hidden;
    }
    .loading-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsivo */
    @media (max-width: 768px) {
      .photo-item {
        width: 120px;
        height: 120px;
      }
      .floating-photos {
        gap: 25px;
        padding: 15px;
      }
      .gate-name {
        font-size: 24px;
      }
      .gate-symbol {
        font-size: 60px;
      }
      .falling-phrase {
        font-size: 16px !important;
      }
    }
    @media (max-width: 480px) {
      .photo-item {
        width: 90px;
        height: 90px;
      }
      .floating-photos {
        gap: 15px;
        padding: 10px;
      }
      .falling-phrase {
        font-size: 14px !important;
      }
    }
  </style>
</head>
<body>

<!-- ===== VÍDEO DE FUNDO ===== -->
<div class="video-bg">
  <video id="bg-video" autoplay loop muted playsinline preload="auto">
    <source src="https://files.catbox.moe/3xm2ia.mp4" type="video/mp4">
  </video>
</div>

<!-- ===== FRASES CAINDO (xingamentos) ===== -->
<div class="phrases-container" id="phrases-container"></div>

<!-- ===== FOGUINHO CAINDO NO GATE ===== -->
<div class="gate-fire" id="gate-fire"></div>

<!-- ===== FOTOS FLUTUANDO ===== -->
<div class="floating-photos" id="floating-photos">
  <div class="photo-item">
    <img src="https://media.discordapp.net/attachments/1524903515984756797/1525651752131625070/WhatsApp_Image_2026-07-05_at_17.36.04.jpeg?ex=6a54296a&is=6a52d7ea&hm=fdfb9c654a7766373aff36e59b62cfd01087baaaf00c0316bf0b3a1769736d82&=&format=webp&width=900&height=893" alt="Natasha 1">
  </div>
  <div class="photo-item">
    <img src="https://media.discordapp.net/attachments/1524903515984756797/1525651752131625070/WhatsApp_Image_2026-07-05_at_17.36.04.jpeg?ex=6a54296a&is=6a52d7ea&hm=fdfb9c654a7766373aff36e59b62cfd01087baaaf00c0316bf0b3a1769736d82&=&format=webp&width=900&height=893" alt="Natasha 2">
  </div>
  <div class="photo-item">
    <img src="https://media.discordapp.net/attachments/1524903515984756797/1525651752131625070/WhatsApp_Image_2026-07-05_at_17.36.04.jpeg?ex=6a54296a&is=6a52d7ea&hm=fdfb9c654a7766373aff36e59b62cfd01087baaaf00c0316bf0b3a1769736d82&=&format=webp&width=900&height=893" alt="Natasha 3">
  </div>
  <div class="photo-item">
    <img src="https://media.discordapp.net/attachments/1524903515984756797/1525651752131625070/WhatsApp_Image_2026-07-05_at_17.36.04.jpeg?ex=6a54296a&is=6a52d7ea&hm=fdfb9c654a7766373aff36e59b62cfd01087baaaf00c0316bf0b3a1769736d82&=&format=webp&width=900&height=893" alt="Natasha 4">
  </div>
  <div class="photo-item">
    <img src="https://media.discordapp.net/attachments/1524903515984756797/1525651752131625070/WhatsApp_Image_2026-07-05_at_17.36.04.jpeg?ex=6a54296a&is=6a52d7ea&hm=fdfb9c654a7766373aff36e59b62cfd01087baaaf00c0316bf0b3a1769736d82&=&format=webp&width=900&height=893" alt="Natasha 5">
  </div>
  <div class="photo-item">
    <img src="https://media.discordapp.net/attachments/1524903515984756797/1525651752131625070/WhatsApp_Image_2026-07-05_at_17.36.04.jpeg?ex=6a54296a&is=6a52d7ea&hm=fdfb9c654a7766373aff36e59b62cfd01087baaaf00c0316bf0b3a1769736d82&=&format=webp&width=900&height=893" alt="Natasha 6">
  </div>
</div>

<!-- ===== GATE DE ENTRADA ===== -->
<div class="gate" id="gate">
  <div class="gate-symbol">🔥</div>
  <div class="gate-name">Natasha</div>
  <div class="gate-hint">✦ Clique para entrar ✦</div>
</div>

<!-- ===== LOADING ===== -->
<div class="loading-overlay" id="loading">
  <div class="loading-spinner"></div>
</div>

<script>
  (function() {
    const gate = document.getElementById('gate');
    const loading = document.getElementById('loading');
    const phrasesContainer = document.getElementById('phrases-container');
    const gateFire = document.getElementById('gate-fire');

    // ===== LISTA DE XINGAMENTOS =====
    const insults = [
      "FEIA DEMAIS",
      "SEM SAL",
      "CHATA PRA CARAMBA",
      "RIDÍCULA",
      "SEM GRAÇA",
      "TOSCA",
      "MUITO ZOADA",
      "DEBOCHADA",
      "SEM NOÇÃO",
      "CABEÇA OCA",
      "MAL EDUCADA",
      "EGOCÊNTRICA",
      "FALSA",
      "METIDA",
      "CHATA",
      "SEM VERGONHA",
      "BOCUDA",
      "RANZIZA",
      "PREGUIÇOSA",
      "DESATENCIOSA",
      "MALUCA",
      "DOIDA",
      "SEM JEITO",
      "PAU MANDADO",
      "FRESCURA",
      "MIMADA",
      "INSENSÍVEL",
      "TEIMOSA",
      "BURRA",
      "LENTA"
    ];

    // ===== FRASES CAINDO =====
    const isMobile = window.innerWidth < 600;
    let phraseInterval = null;

    function createFallingPhrase() {
      if (!phrasesContainer) return;
      const phrase = document.createElement('div');
      phrase.classList.add('falling-phrase');
      
      // Escolher xingamento aleatório
      const randomInsult = insults[Math.floor(Math.random() * insults.length)];
      phrase.textContent = randomInsult;
      
      // Posição horizontal aleatória
      phrase.style.left = Math.random() * 100 + '%';
      
      // Tamanho aleatório
      const sizeVariation = isMobile ? 14 : 22;
      const randomSize = Math.floor(Math.random() * 10) + sizeVariation;
      phrase.style.fontSize = randomSize + 'px';
      
      // Duração da animação
      const duration = Math.random() * (isMobile ? 10 : 7) + (isMobile ? 6 : 4);
      phrase.style.animationDuration = duration + 's';
      
      // Delay aleatório
      phrase.style.animationDelay = Math.random() * 5 + 's';
      
      // Rotação aleatória
      const rotation = (Math.random() - 0.5) * 15;
      phrase.style.transform = `rotate(${rotation}deg)`;
      
      phrasesContainer.appendChild(phrase);
      
      setTimeout(() => {
        if (phrase && phrase.remove) phrase.remove();
      }, (duration + 5) * 1000);
    }

    function startPhrases() {
      if (phraseInterval) clearInterval(phraseInterval);
      phraseInterval = setInterval(createFallingPhrase, isMobile ? 2500 : 1200);
      // Criar algumas frases iniciais
      for (let i = 0; i < (isMobile ? 6 : 12); i++) {
        setTimeout(createFallingPhrase, i * (isMobile ? 400 : 200));
      }
    }

    // ===== FOGUINHO CAINDO NO GATE =====
    let gateFireInterval = null;

    function createGateFire() {
      if (!gateFire) return;
      const fire = document.createElement('div');
      fire.classList.add('gate-fire-particle');
      fire.textContent = '🔥';
      fire.style.left = Math.random() * 100 + '%';
      
      // Tamanho aleatório
      const size = Math.floor(Math.random() * 20) + 20;
      fire.style.fontSize = size + 'px';
      
      // Duração da animação
      const duration = Math.random() * 6 + 4;
      fire.style.animationDuration = duration + 's';
      
      // Delay aleatório
      fire.style.animationDelay = Math.random() * 8 + 's';
      
      gateFire.appendChild(fire);
      
      setTimeout(() => {
        if (fire && fire.remove) fire.remove();
      }, (duration + 5) * 1000);
    }

    function startGateFire() {
      if (gateFireInterval) clearInterval(gateFireInterval);
      gateFireInterval = setInterval(createGateFire, 3000);
      // Criar alguns foguinhos iniciais
      for (let i = 0; i < 5; i++) {
        setTimeout(createGateFire, i * 800);
      }
    }

    // ===== ABRIR SITE =====
    function openSite() {
      if (!gate) return;
      
      // Mostrar loading
      if (loading) loading.classList.add('active');
      
      gate.classList.add('hidden');
      
      setTimeout(() => {
        if (loading) loading.classList.remove('active');
        // Iniciar frases de xingamento
        startPhrases();
        // Parar foguinhos do gate (já que o gate sumiu)
        if (gateFireInterval) clearInterval(gateFireInterval);
        // Remover foguinhos do gate
        if (gateFire) gateFire.innerHTML = '';
      }, 1500);
    }

    if (gate) {
      gate.addEventListener('click', openSite);
      gate.addEventListener('touchstart', function(e) {
        e.preventDefault();
        e.stopPropagation();
        openSite();
      }, { passive: false });
      gate.style.cursor = 'pointer';
    }

    // Iniciar foguinhos do gate imediatamente
    startGateFire();

    // ===== INICIAR VÍDEO =====
    const bgVideo = document.getElementById('bg-video');
    if (bgVideo) {
      bgVideo.play().catch(() => {});
    }

    // ===== PRÉ-CARREGAR FOTOS =====
    const photos = document.querySelectorAll('.photo-item img');
    photos.forEach(img => {
      if (img.complete) return;
      img.addEventListener('error', () => {
        img.src = 'https://cdn.discordapp.com/avatars/1231281182948196430/a_avatar.gif?size=256';
      });
    });

  })();
</script>
</body>
</html>
